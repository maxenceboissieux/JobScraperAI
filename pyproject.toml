[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscraper"
version = "1.0.0"
description = "Agrégateur d'offres d'emploi en France - LinkedIn, HelloWork, France Travail, WTTJ, Adzuna, Free-Work"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    {name = "JobScraper Contributors"}
]
keywords = ["scraping", "jobs", "linkedin", "france", "emploi", "hellowork", "wttj", "france-travail", "free-work"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "alembic>=1.16",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.116",
    "lxml>=5.0.0",
    "selenium>=4.15.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "loguru>=0.7.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
    "anyio>=4.0",
    "httpx>=0.28",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
]
async = [
    "aiohttp>=3.9.0",
    "playwright>=1.40.0",
]

[project.scripts]
jobscraper = "jobscraper.cli:main"
jobscraper-api = "jobscraper.api.app:run"

[project.urls]
Homepage = "https://github.com/zeffut/jobscraper"
Repository = "https://github.com/zeffut/jobscraper"
Issues = "https://github.com/zeffut/jobscraper/issues"

[tool.setuptools]
# Le build Vite reste un artefact local dans frontend/dist, pas une donnée du wheel.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in tests that contact public job sites"]
addopts = "--strict-markers"
